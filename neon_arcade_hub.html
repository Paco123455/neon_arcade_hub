    <script>
        // --- SYNTHESIZED WEB AUDIO API ---
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'beep') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'hit') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'score') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(587.33, now); // D5
                osc.frequency.setValueAtTime(880, now + 0.08); // A5
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(80, now + 0.5);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('audio-icon');
            if (soundEnabled) {
                btn.className = 'fa-solid fa-volume-high text-xl';
                playSound('score');
            } else {
                btn.className = 'fa-solid fa-volume-xmark text-xl';
            }
        }

        // --- GAME DATABASE (40 GAMES) ---

            { id: 29, name: "Tris 4x4", cat: "puzzle", icon: "fa-border-all", color: "text-cyberpunk-green", desc: "Tris avanzato su griglia 4x4, allinea 4 simboli." },
            { id: 30, name: "Reaction Timer", cat: "reaction", icon: "fa-stopwatch", color: "text-cyberpunk-yellow", desc: "Testa i tuoi riflessi al millisecondo esatto." },
            { id: 31, name: "Catch the Coin", cat: "arcade", icon: "fa-coins", color: "text-cyberpunk-purple", desc: "Raccogli i crediti dorati prima che tocchino il suolo." },
            { id: 32, name: "Snake Xtreme", cat: "arcade", icon: "fa-otter", color: "text-cyberpunk-pink", desc: "Snake con barriere e ostacoli interni casuali." },
            { id: 33, name: "Neon Maze", cat: "puzzle", icon: "fa-map", color: "text-cyberpunk-cyan", desc: "Trova l'uscita nel labirinto cibernetico buio." },
            { id: 34, name: "Lucky Roll", cat: "arcade", icon: "fa-dice", color: "text-cyberpunk-green", desc: "Lancia i dadi quantistici e totalizza il punteggio." },
            { id: 35, name: "Cyber Quiz", cat: "puzzle", icon: "fa-circle-question", color: "text-cyberpunk-yellow", desc: "Rispondi correttamente alle domande tech e cyberpunk." },
            { id: 36, name: "Breakout Pro", cat: "arcade", icon: "fa-fire", color: "text-cyberpunk-purple", desc: "Brick breaker potenziato con velocità incrementale." },
            { id: 37, name: "Neon Sudoku", cat: "puzzle", icon: "fa-table-cells", color: "text-cyberpunk-pink", desc: "Sudoku rapido 4x4 con cifre o simboli al neon." },
            { id: 38, name: "Beatmaker", cat: "arcade", icon: "fa-music", color: "text-cyberpunk-cyan", desc: "Sequenziatore musicale interattivo con pad elettronici." },
            { id: 39, name: "Laser Deflector", cat: "puzzle", icon: "fa-laser-pointer", color: "text-cyberpunk-green", desc: "Posiziona gli specchi per guidare il raggio laser." },
            { id: 40, name: "Clicker Battle", cat: "reaction", icon: "fa-gauge-high", color: "text-cyberpunk-yellow", desc: "Raffica di click nel tempo limite di 10 secondi." }
        ];

        let currentActiveGame = null;
        let currentGameInterval = null;
        let currentGameKeyHandler = null;
        let highScores = JSON.parse(localStorage.getItem('neon_hub_scores') || '{}');
        let totalHubScore = parseInt(localStorage.getItem('neon_hub_total') || '0');

        document.getElementById('total-score').innerText = totalHubScore;

        // Render Game Cards
        function renderGames(filter = 'all') {
            const grid = document.getElementById('games-grid');
            grid.innerHTML = '';

            const filtered = filter === 'all' ? gamesData : gamesData.filter(g => g.cat === filter);

            filtered.forEach(game => {
                const hs = highScores[game.id] || 0;
                const card = document.createElement('div');
                card.className = "bg-cyberpunk-panel border border-cyberpunk-border hover:border-cyberpunk-cyan rounded-2xl p-5 flex flex-col justify-between transition transform hover:-translate-y-1 shadow-lg group relative overflow-hidden";
                card.innerHTML = `
                    <div class="absolute -right-4 -top-4 w-20 h-20 bg-cyberpunk-cyan/5 rounded-full blur-xl group-hover:bg-cyberpunk-cyan/20 transition"></div>
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <div class="w-12 h-12 rounded-xl bg-cyberpunk-bg border border-cyberpunk-border flex items-center justify-center ${game.color} text-2xl group-hover:scale-110 transition">
                                <i class="fa-solid ${game.icon}"></i>
                            </div>
                            <span class="text-xs uppercase tracking-widest px-2.5 py-1 rounded-md bg-cyberpunk-border/50 text-gray-400 title-font">${game.cat}</span>
                        </div>
                        <h3 class="title-font text-lg font-bold text-white mb-2 group-hover:text-cyberpunk-cyan transition">${game.id}. ${game.name}</h3>
                        <p class="text-xs text-gray-400 mb-4 line-clamp-2">${game.desc}</p>
                    </div>
                    <div class="pt-4 border-t border-cyberpunk-border/60 flex items-center justify-between">
                        <span class="text-xs text-gray-400">High: <strong class="text-cyberpunk-yellow">${hs}</strong></span>
                        <button onclick="openGame(${game.id})" class="px-4 py-2 bg-cyberpunk-cyan/10 hover:bg-cyberpunk-cyan text-cyberpunk-cyan hover:text-cyberpunk-bg border border-cyberpunk-cyan/40 hover:border-cyberpunk-cyan rounded-xl title-font text-xs font-bold transition shadow-neon-cyan">
                            PLAY
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterGames(cat) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn px-5 py-2.5 rounded-xl title-font text-sm font-semibold tracking-wider transition bg-cyberpunk-panel border border-cyberpunk-border text-gray-300 hover:border-cyberpunk-cyan hover:text-cyberpunk-cyan";
            });
            event.currentTarget.className = "filter-btn px-5 py-2.5 rounded-xl title-font text-sm font-semibold tracking-wider transition bg-cyberpunk-cyan text-cyberpunk-bg shadow-neon-cyan";
            renderGames(cat);
        }

        renderGames();

        // --- STREAMING_CHUNK:Game Modal Controller & Cleanup ---
        function openGame(id) {
            playSound('click');
            const game = gamesData.find(g => g.id === id);
            currentActiveGame = game;
            
            document.getElementById('modal-title').innerText = `${game.id}. ${game.name}`;
            document.getElementById('modal-icon').className = `fa-solid ${game.icon} ${game.color}`;
            document.getElementById('modal-highscore').innerText = highScores[game.id] || 0;
            
            document.getElementById('game-modal').classList.remove('hidden');
            
            setupGameInstance(id);
        }

        function closeGameModal() {
            playSound('click');
            if (currentGameInterval) clearInterval(currentGameInterval);
            if (currentGameKeyHandler) window.removeEventListener('keydown', currentGameKeyHandler);
            document.getElementById('game-modal').classList.add('hidden');
            document.getElementById('modal-body').innerHTML = '';
            currentActiveGame = null;
        }

        function restartCurrentGame() {
            if (currentActiveGame) {
                openGame(currentActiveGame.id);
            }
        }

        function saveScore(gameId, score) {
            const currentHS = highScores[gameId] || 0;
            if (score > currentHS) {
                highScores[gameId] = score;
                localStorage.setItem('neon_hub_scores', JSON.stringify(highScores));
                document.getElementById('modal-highscore').innerText = score;
                playSound('score');
            }
            // Update total hub score
            let total = Object.values(highScores).reduce((a, b) => a + b, 0);
            totalHubScore = total;
            localStorage.setItem('neon_hub_total', total);
            document.getElementById('total-score').innerText = total;
            renderGames();
        }

        // --- STREAMING_CHUNK:Implementing All 40 Games Logic ---
        function setupGameInstance(id) {
            if (currentGameInterval) clearInterval(currentGameInterval);
            if (currentGameKeyHandler) window.removeEventListener('keydown', currentGameKeyHandler);
            const body = document.getElementById('modal-body');
            body.innerHTML = '';

            switch(id) {
                case 1: initTetris(body); break;
                case 2: initMemoryMatch(body); break;
                case 3: initSnake(body); break;
                case 4: initSpaceShooter(body); break;
                case 5: initCyberPong(body); break;
                case 6: init2048(body); break;
                case 7: initFlappyCyber(body); break;
                case 8: initBrickBreaker(body); break;
                case 9: initSimonCyber(body); break;
                case 10: initCyberRunner(body); break;

        // --- GAME 1: TETRIS ---
        function initTetris(container) {
            container.innerHTML = `
                <div class="flex flex-col items-center">
                    <div class="text-cyberpunk-cyan font-bold mb-2 title-font">Punteggio: <span id="tetris-score">0</span></div>
                    <canvas id="tetris-canvas" width="200" height="400" class="border-2 border-cyberpunk-cyan bg-black rounded-lg shadow-neon-cyan"></canvas>
                    <div class="flex gap-2 mt-4">
                        <button onclick="tetrisMove(-1)" class="px-4 py-2 bg-cyberpunk-border rounded text-white"><i class="fa-solid fa-arrow-left"></i></button>
                        <button onclick="tetrisRotate()" class="px-4 py-2 bg-cyberpunk-border rounded text-white"><i class="fa-solid fa-rotate"></i></button>
                        <button onclick="tetrisMove(1)" class="px-4 py-2 bg-cyberpunk-border rounded text-white"><i class="fa-solid fa-arrow-right"></i></button>
                        <button onclick="tetrisDrop()" class="px-4 py-2 bg-cyberpunk-cyan text-black rounded font-bold"><i class="fa-solid fa-arrow-down"></i></button>
                    </div>
                </div>
            `;
            const canvas = document.getElementById('tetris-canvas');
            const ctx = canvas.getContext('2d');
            const ROWS = 20, COLS = 10, BLOCK = 20;
            let board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
            let score = 0;
            let colors = ['', '#00f0ff', '#ff0055', '#fcee0a', '#bd00ff', '#00ff66', '#ff8800', '#0088ff'];
            const shapes = [
                [[1,1,1,1]], // I
                [[1,1],[1,1]], // O
                [[0,1,0],[1,1,1]], // T
                [[1,0,0],[1,1,1]], // L
                [[0,0,1],[1,1,1]], // J
                [[0,1,1],[1,1,0]], // S
                [[1,1,0],[0,1,1]]  // Z
            ];
            let currentPiece = null;
            let currentX = 3, currentY = 0, currentColor = 1;

            function newPiece() {
                const idx = Math.floor(Math.random() * shapes.length);
                currentPiece = shapes[idx];
                currentColor = idx + 1;
                currentX = Math.floor(COLS / 2) - Math.floor(currentPiece[0].length / 2);
                currentY = 0;
                if (checkCollision(0, 0, currentPiece)) {
                    gameOverTetris();
                }
            }

            function checkCollision(dx, dy, piece) {
                for (let r = 0; r < piece.length; r++) {
                    for (let c = 0; c < piece[r].length; c++) {
                        if (piece[r][c]) {
                            let nx = currentX + c + dx;
                            let ny = currentY + r + dy;
                            if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
                            if (ny >= 0 && board[ny][nx]) return true;
                        }
                    }
                }
                return false;
            }

            function merge() {
                for (let r = 0; r < currentPiece.length; r++) {
                    for (let c = 0; c < currentPiece[r].length; c++) {
                        if (currentPiece[r][c]) {
                            if (currentY + r >= 0) board[currentY + r][currentX + c] = currentColor;
                        }
                    }
                }
            }

            function clearLines() {
                let lines = 0;
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (board[r].every(cell => cell > 0)) {
                        board.splice(r, 1);
                        board.unshift(Array(COLS).fill(0));
                        lines++;
                        r++;
                    }
                }
                if (lines > 0) {
                    score += lines * 100 * lines;
                    document.getElementById('tetris-score').innerText = score;
                    saveScore(1, score);
                    playSound('score');
                }
            }

            window.tetrisMove = (dir) => {
                if (!currentPiece) return;
                if (!checkCollision(dir, 0, currentPiece)) {
                    currentX += dir;
                    draw();
                }
            };

            window.tetrisDrop = () => {
                if (!currentPiece) return;
                if (!checkCollision(0, 1, currentPiece)) {
                    currentY++;
                } else {
                    merge();
                    clearLines();
                    newPiece();
                }
                draw();
            };

            window.tetrisRotate = () => {
                if (!currentPiece) return;
                const rotated = currentPiece[0].map((_, index) => currentPiece.map(row => row[index]).reverse());
                if (!checkCollision(0, 0, rotated)) {
                    currentPiece = rotated;
                    draw();
                    playSound('click');
                }
            };

            function gameOverTetris() {
                clearInterval(currentGameInterval);
                currentGameInterval = null;
                playSound('gameover');
                ctx.fillStyle = "rgba(0,0,0,0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff0055";
                ctx.font = "bold 18px Orbitron";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width/2, canvas.height/2);
            }

            function draw() {
                ctx.fillStyle = "#05050a";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Draw board
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (board[r][c]) {
                            ctx.fillStyle = colors[board[r][c]];
                            ctx.fillRect(c * BLOCK, r * BLOCK, BLOCK - 1, BLOCK - 1);
                        }
                    }
                }
                // Draw current piece
                if (currentPiece) {
                    ctx.fillStyle = colors[currentColor];
                    for (let r = 0; r < currentPiece.length; r++) {
                        for (let c = 0; c < currentPiece[r].length; c++) {
                            if (currentPiece[r][c]) {
                                ctx.fillRect((currentX + c) * BLOCK, (currentY + r) * BLOCK, BLOCK - 1, BLOCK - 1);
                            }
                        }
                    }
                }
            }

            newPiece();
            draw();
            currentGameInterval = setInterval(window.tetrisDrop, 500);
            currentGameKeyHandler = (e) => {
                if (e.key === 'ArrowLeft') tetrisMove(-1);
                if (e.key === 'ArrowRight') tetrisMove(1);
                if (e.key === 'ArrowDown') tetrisDrop();
                if (e.key === 'ArrowUp') tetrisRotate();
            };
            window.addEventListener('keydown', currentGameKeyHandler);
        }

                            flipped = [];
                            matched++;

                                });
                                flipped = [];
                            }, 700);
                        }
                    }
                }
            }
        }

            window.bbMove = (offset) => { paddleX = Math.max(0, Math.min(200, paddleX + offset)); };

            function update() {
                ballX += dx; ballY += dy;
                if(ballX <= 0 || ballX >= 270) dx *= -1;
                if(ballY <= 0) dy *= -1;
                if(ballY >= 295 && ballX >= paddleX && ballX <= paddleX + 80) { dy *= -1; playSound('click'); }
                if(ballY > 320) { clearInterval(currentGameInterval); playSound('gameover'); }

                bricks.forEach(b => {
                    if(b.alive && ballX >= b.x && ballX <= b.x + b.w && ballY >= b.y && ballY <= b.y + b.h) {
                        b.alive = false;
                        dy *= -1;
                        score += 15;
                        document.getElementById('bb-score').innerText = score;
                        saveScore(8, score);
                        playSound('score');
                    }
                });

                ctx.fillStyle = "#05050a";
                ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = "#fcee0a";
                ctx.fillRect(paddleX, 305, 80, 10);
                ctx.fillStyle = "#00f0ff";
                ctx.beginPath(); ctx.arc(ballX, ballY, 6, 0, Math.PI*2); ctx.fill();
                bricks.forEach(b => {
                    if(b.alive) {
                        ctx.fillStyle = "#ff0055";
                        ctx.fillRect(b.x, b.y, b.w, b.h);
                    }
                });
            }
            currentGameInterval = setInterval(update, 30);
        }

                    </div>
                </div>
            `;
            const canvas = document.getElementById('cc-canvas');
            const ctx = canvas.getContext('2d');
            let bx = 110, coinX = 130, coinY = 0, score = 0;

            window.ccMove = (offset) => { bx = Math.max(0, Math.min(200, bx + offset)); };

            function update() {
                coinY += 4;
                if(coinY > 300) { coinY = 0; coinX = Math.random() * 220; }
                if(coinY >= 270 && coinX >= bx && coinX <= bx + 60) {
                    coinY = 0; coinX = Math.random() * 220;
                    score += 10;
                    document.getElementById('cc-score').innerText = score;
                    saveScore(31, score);
                    playSound('score');
                }

                ctx.fillStyle = "#05050a"; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = "#bd00ff"; ctx.fillRect(bx, 280, 60, 10);
                ctx.fillStyle = "#fcee0a"; ctx.beginPath(); ctx.arc(coinX, coinY, 8, 0, Math.PI*2); ctx.fill();
            }
            currentGameInterval = setInterval(update, 30);
        }
